<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counting Down to 5.20</title>
  <meta name="description" content="A countdown to 5.20, followed by the HuYi520 theme page.">
  <link rel="preload" as="image" href="assets/home-poster-fast.jpg">
  <link rel="preload" as="image" href="assets/flower-bg-tulips.jpg">
  <link rel="preload" as="image" href="assets/carousel/fast/01-linabell-blue.jpg">
  <link rel="preload" as="audio" href="assets/audio/huyi520-bgm.mp3" type="audio/mpeg">
  <style>
    :root {
      color-scheme: light;
      --ink: #251b2e;
      --muted: #74687e;
      --line: rgba(37, 27, 46, 0.13);
      --paper: rgba(255, 255, 255, 0.76);
      --pink: #ff78aa;
      --rose: #f5427b;
      --lavender: #a88cff;
      --violet: #6e4cc7;
      --shenhua-blue: #166ee5;
      --arsenal-red: #d71920;
      --gold: #f5b942;
      --green: #1b9a5a;
      --shadow: 0 24px 80px rgba(66, 38, 88, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 16% 14%, rgba(255, 120, 170, 0.24), transparent 28%),
        radial-gradient(circle at 82% 10%, rgba(22, 110, 229, 0.20), transparent 24%),
        linear-gradient(135deg, #fff7fb 0%, #f7f4ff 43%, #eef7ff 100%);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      content: "";
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.42) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.42) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.55), transparent);
    }

    button {
      font: inherit;
    }

    .music-toggle {
      position: fixed;
      right: clamp(14px, 3vw, 26px);
      bottom: clamp(14px, 3vw, 26px);
      z-index: 20;
      display: grid;
      width: clamp(46px, 10vw, 56px);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.94), rgba(255, 255, 255, 0.52) 62%),
        linear-gradient(135deg, rgba(255, 120, 170, 0.72), rgba(22, 110, 229, 0.64));
      box-shadow: 0 18px 42px rgba(66, 38, 88, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.76);
      color: #d71920;
      cursor: pointer;
      place-items: center;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      backdrop-filter: blur(16px);
    }

    .music-toggle:hover,
    .music-toggle:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 22px 52px rgba(66, 38, 88, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.86);
      outline: none;
    }

    .music-toggle.is-playing {
      background:
        radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.98), rgba(255, 247, 219, 0.62) 62%),
        linear-gradient(135deg, rgba(245, 185, 66, 0.76), rgba(255, 120, 170, 0.72));
    }

    .music-toggle.is-playing::after {
      position: absolute;
      inset: -7px;
      border: 1px solid rgba(255, 120, 170, 0.32);
      border-radius: inherit;
      content: "";
      animation: musicPulse 1.8s ease-out infinite;
    }

    .music-icon {
      position: relative;
      z-index: 1;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 900;
      line-height: 1;
    }

    .page {
      display: grid;
      min-height: 100vh;
      padding: clamp(20px, 4vw, 44px);
      place-items: center;
    }

    .stage {
      width: min(1120px, 100%);
    }

    .countdown-page .hero {
      display: grid;
      grid-template-columns: minmax(320px, 0.78fr) minmax(380px, 1.22fr);
      gap: clamp(18px, 4vw, 44px);
      align-items: center;
    }

    .countdown-copy {
      position: relative;
      z-index: 1;
      padding: clamp(22px, 4vw, 38px);
      border: 1px solid rgba(111, 58, 36, 0.12);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 246, 222, 0.70));
      box-shadow: 0 22px 70px rgba(126, 75, 38, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
      overflow: hidden;
      text-align: center;
    }

    .countdown-copy::before {
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      content: "";
      background: linear-gradient(90deg, #166ee5 0 28%, #fff 28% 34%, #d71920 34% 68%, #fff 68% 74%, #f5b942 74% 100%);
    }

    .countdown-copy::after {
      position: absolute;
      right: -42px;
      bottom: -46px;
      width: 132px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 120, 170, 0.18), transparent 68%);
      content: "";
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      backdrop-filter: blur(16px);
    }

    .spark {
      width: 10px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--rose);
      box-shadow: 18px 0 0 var(--shenhua-blue), 36px 0 0 var(--gold);
    }

    h1 {
      max-width: 780px;
      margin: 22px 0 16px;
      font-size: clamp(2.7rem, 8vw, 7.2rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .lead {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.02rem, 2vw, 1.32rem);
      line-height: 1.75;
    }

    .countdown-page .eyebrow {
      border-color: rgba(133, 80, 34, 0.16);
      background: rgba(255, 255, 255, 0.64);
      color: #80512f;
    }

    .countdown-page .eyebrow,
    .countdown-page .lead,
    .countdown-page .note {
      display: none;
    }

    .countdown-page h1 {
      position: relative;
      z-index: 1;
      display: inline-block;
      margin: 0;
      color: transparent;
      background: linear-gradient(92deg, #f0443e 0%, #ff78aa 34%, #166ee5 68%, #d71920 100%);
      background-clip: text;
      -webkit-background-clip: text;
      font-size: clamp(2.45rem, 6vw, 5.8rem);
      filter: drop-shadow(0 10px 22px rgba(111, 58, 36, 0.18));
      text-wrap: balance;
    }

    .countdown-page h1::before,
    .countdown-page h1::after {
      position: absolute;
      display: grid;
      width: clamp(28px, 5vw, 48px);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 12px 28px rgba(111, 58, 36, 0.12);
      color: #f0443e;
      content: "♥";
      font-size: clamp(1rem, 2.4vw, 1.65rem);
      place-items: center;
    }

    .countdown-page h1::before {
      top: -0.45em;
      right: -0.55em;
      transform: rotate(12deg);
    }

    .countdown-page h1::after {
      left: -0.55em;
      bottom: -0.34em;
      color: #166ee5;
      content: "★";
      transform: rotate(-10deg);
    }

    .countdown-page .lead,
    .countdown-page .note {
      color: #7b532f;
    }

    .countdown {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(72px, 1fr));
      gap: clamp(10px, 2vw, 16px);
      margin-top: clamp(22px, 4vw, 34px);
      justify-content: center;
      text-align: center;
    }

    .time-box {
      position: relative;
      display: grid;
      min-height: clamp(104px, 13vw, 136px);
      padding: 18px 12px;
      border: 2px solid rgba(111, 58, 36, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 18px 38px rgba(132, 78, 38, 0.14);
      place-items: center;
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .time-box::before {
      position: absolute;
      inset: 0 0 auto;
      height: 8px;
      background: linear-gradient(90deg, #f0443e, #ff9c75, #ffe465);
      content: "";
    }

    .time-box::after {
      position: absolute;
      right: -26px;
      bottom: -30px;
      width: 76px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 106, 100, 0.13);
      content: "";
    }

    .time-box strong {
      position: relative;
      z-index: 1;
      color: #ef3f3a;
      font-size: clamp(2.1rem, 6vw, 4.4rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    @supports (font-variant-numeric: tabular-nums) {
      .time-box strong {
        font-feature-settings: "tnum";
      }
    }

    .time-box span {
      position: relative;
      z-index: 1;
      margin-top: 9px;
      color: #8a5b2d;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.65;
    }

    .art {
      position: relative;
      width: min(640px, 100%);
      min-height: auto;
      aspect-ratio: 1;
      justify-self: center;
      border: 0;
      border-radius: 8px;
      background: #fff7bd;
      box-shadow: 0 28px 80px rgba(126, 75, 38, 0.20), 0 0 0 10px rgba(255, 255, 255, 0.48);
      overflow: hidden;
    }

    .art::before,
    .art::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }

    .art::before {
      inset: 10% -24% auto auto;
      width: 74%;
      aspect-ratio: 1;
      border: 42px solid rgba(255, 255, 255, 0.22);
      border-radius: 50%;
      transform: rotate(-18deg);
    }

    .art::after {
      inset: auto auto -19% -16%;
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 128, 91, 0.16);
    }

    .countdown-poster {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: none;
    }

    .countdown-image {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .countdown-image-gloss {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.10), transparent 38%),
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.38), transparent 16%);
      pointer-events: none;
    }

    .countdown-ribbon {
      display: none;
    }

    .scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .floating {
      position: absolute;
      z-index: 2;
      display: grid;
      width: 76px;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 14px 35px rgba(37, 27, 46, 0.14);
      color: var(--ink);
      font-weight: 900;
      place-items: center;
      backdrop-filter: blur(14px);
    }

    .floating.football {
      right: 7%;
      bottom: 13%;
      color: #141414;
      font-size: 2rem;
    }

    .floating.heart {
      top: 8%;
      left: 8%;
      color: var(--rose);
      font-size: 2.5rem;
    }

    .floating.star {
      right: 12%;
      top: 16%;
      color: var(--gold);
      font-size: 2.2rem;
    }

    .countdown-page .floating {
      display: none;
    }

    .love-page {
      display: none;
    }

    body[data-state="love"] .countdown-page {
      display: none;
    }

    body[data-state="love"] .love-page {
      display: grid;
    }

    body[data-state="love"] {
      background:
        linear-gradient(115deg, rgba(255, 120, 170, 0.23), transparent 36%),
        linear-gradient(245deg, rgba(22, 110, 229, 0.20), transparent 36%),
        linear-gradient(135deg, #fff5f8 0%, #f1f5ff 48%, #fff9e8 100%);
    }

    .love-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(22px, 4vw, 36px);
    }

    .love-hero {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(320px, 1.08fr);
      gap: clamp(22px, 5vw, 58px);
      align-items: center;
    }

    .love-copy {
      position: relative;
      z-index: 1;
    }

    .love-title {
      margin: 18px 0 12px;
      font-size: clamp(2.5rem, 7vw, 6rem);
      line-height: 0.98;
      text-wrap: balance;
    }

    .name-line {
      display: block;
      color: var(--rose);
    }

    .mini-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .mini-stats span {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 12px;
      border: 1px solid rgba(37, 27, 46, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
      backdrop-filter: blur(12px);
    }

    .love-collage {
      position: relative;
      min-height: clamp(440px, 56vw, 620px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(142deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.46)),
        conic-gradient(from 150deg at 52% 48%, rgba(255, 120, 170, 0.30), rgba(22, 110, 229, 0.28), rgba(215, 25, 32, 0.24), rgba(245, 185, 66, 0.30), rgba(255, 120, 170, 0.30));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .love-collage::before {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 8px;
      content: "";
      pointer-events: none;
    }

    .collage-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .poster-chip {
      position: absolute;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(37, 27, 46, 0.12);
      backdrop-filter: blur(16px);
    }

    .chip-kitty {
      left: 9%;
      top: 9%;
    }

    .chip-fox {
      right: 8%;
      top: 17%;
    }

    .chip-football {
      left: 12%;
      bottom: 12%;
    }

    .chip-love {
      right: 9%;
      bottom: 10%;
      color: var(--rose);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .theme {
      min-height: 174px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 18px 42px rgba(59, 36, 88, 0.08);
      overflow: hidden;
      position: relative;
    }

    .theme::before,
    .theme::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }

    .theme::before {
      inset: 0 0 auto;
      height: 5px;
      background: var(--pink);
    }

    .theme::after {
      right: -36px;
      bottom: -42px;
      width: 112px;
      aspect-ratio: 1;
      border-radius: 50%;
      opacity: 0.78;
    }

    .theme h2 {
      margin: 0 0 10px;
      font-size: 1.15rem;
      letter-spacing: 0;
    }

    .theme p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .theme-cat::after {
      background: var(--pink);
    }

    .theme-fox::after {
      background: var(--lavender);
    }

    .theme-fox::before {
      background: var(--lavender);
    }

    .theme-shenhua::after {
      background: var(--shenhua-blue);
    }

    .theme-shenhua::before {
      background: var(--shenhua-blue);
    }

    .theme-arsenal::after {
      background: var(--arsenal-red);
    }

    .theme-arsenal::before {
      background: var(--arsenal-red);
    }

    .badge {
      display: inline-grid;
      width: 46px;
      aspect-ratio: 1;
      margin-bottom: 18px;
      border-radius: 50%;
      color: #fff;
      font-weight: 1000;
      place-items: center;
    }

    .theme-cat .badge {
      background: var(--pink);
    }

    .theme-fox .badge {
      background: var(--lavender);
    }

    .theme-shenhua .badge {
      background: var(--shenhua-blue);
    }

    .theme-arsenal .badge {
      background: var(--arsenal-red);
    }

    .letter {
      padding: clamp(22px, 4vw, 34px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: var(--shadow);
      line-height: 1.95;
      backdrop-filter: blur(18px);
    }

    .letter p {
      margin: 0;
      color: #44384c;
      font-size: clamp(1.02rem, 1.8vw, 1.24rem);
    }

    .signature {
      margin-top: 22px;
      color: var(--rose);
      font-weight: 900;
      text-align: right;
    }

    body[data-state="love"] {
      background:
        linear-gradient(rgba(255, 248, 238, 0.58), rgba(255, 238, 220, 0.64)),
        url("assets/flower-bg-tulips.jpg") center bottom / cover fixed;
    }

    body[data-state="love"]::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      background:
        linear-gradient(115deg, rgba(22, 110, 229, 0.16) 0 18%, transparent 18% 100%),
        linear-gradient(245deg, rgba(215, 25, 32, 0.16) 0 18%, transparent 18% 100%),
        radial-gradient(circle at 18% 78%, rgba(245, 185, 66, 0.22), transparent 24%),
        radial-gradient(circle at 82% 78%, rgba(255, 120, 170, 0.20), transparent 22%);
      pointer-events: none;
    }

    body[data-state="love"]::after {
      display: none;
    }

    .love-page {
      padding-top: clamp(14px, 3vw, 34px);
      padding-bottom: clamp(20px, 4vw, 44px);
    }

    .love-layout {
      gap: clamp(16px, 3vw, 26px);
    }

    .love-hero {
      grid-template-columns: 1fr;
      gap: clamp(14px, 3vw, 22px);
    }

    .love-copy {
      max-width: 860px;
      margin: 0 auto;
      text-align: center;
    }

    .love-copy .eyebrow {
      background: rgba(255, 255, 255, 0.62);
    }

    .love-title {
      margin: 14px auto 10px;
      font-size: clamp(3rem, 9vw, 7.2rem);
      line-height: 0.98;
      color: transparent;
      background: linear-gradient(90deg, #166ee5 0%, #7a2f72 38%, #d71920 72%, #f5b942 100%);
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 12px 24px rgba(95, 35, 42, 0.18));
    }

    .name-line {
      color: #f0443e;
    }

    .love-copy .lead {
      max-width: 760px;
      margin: 0 auto;
      color: #6f5132;
    }

    .love-copy .mini-stats {
      justify-content: center;
      margin-top: 18px;
    }

    .love-copy .mini-stats span {
      border-color: rgba(121, 82, 35, 0.16);
      background: rgba(255, 255, 255, 0.55);
      color: #7b532b;
    }

    .love-collage {
      width: min(980px, 100%);
      min-height: auto;
      aspect-ratio: 1;
      margin: 0 auto;
      border: 0;
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 6%, rgba(255, 255, 255, 0.78), transparent 26%),
        linear-gradient(180deg, #fffbd0 0%, #fff4b9 72%, #ffe2a6 100%);
      box-shadow: 0 28px 80px rgba(126, 75, 38, 0.23);
    }

    .player-carousel {
      position: relative;
      width: min(980px, 100%);
      margin: 0 auto;
      padding: clamp(12px, 2vw, 18px);
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: 8px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.78), rgba(255, 248, 232, 0.64)),
        linear-gradient(135deg, rgba(22, 110, 229, 0.16), rgba(215, 25, 32, 0.16));
      box-shadow: 0 30px 90px rgba(90, 42, 42, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .player-carousel::before {
      position: absolute;
      inset: 0 0 auto;
      z-index: 2;
      height: 8px;
      content: "";
      background: linear-gradient(90deg, #166ee5 0 26%, #fff 26% 31%, #d71920 31% 64%, #fff 64% 69%, #f5b942 69% 100%);
      pointer-events: none;
    }

    .player-carousel::after {
      position: absolute;
      inset: 12px;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.50);
      border-radius: 8px;
      content: "";
      pointer-events: none;
    }

    .carousel-window {
      position: relative;
      aspect-ratio: 16 / 9;
      min-height: 360px;
      border-radius: 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 18%, rgba(22, 110, 229, 0.34), transparent 30%),
        radial-gradient(circle at 82% 72%, rgba(215, 25, 32, 0.32), transparent 30%),
        #501a28;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    .player-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 520ms ease, transform 700ms ease;
      pointer-events: none;
    }

    .player-slide::before {
      position: absolute;
      inset: -24px;
      content: "";
      background-image: var(--slide-bg);
      background-position: center;
      background-size: cover;
      filter: blur(22px) saturate(1.05);
      opacity: 0.55;
      transform: scale(1.06);
    }

    .player-slide.is-active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .player-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: saturate(1.05) contrast(1.04);
      background: rgba(107, 36, 50, 0.08);
      position: relative;
      z-index: 1;
    }

    .player-slide.is-headshot {
      background:
        radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.36), transparent 24%),
        linear-gradient(135deg, #0d4ca8, #166ee5 48%, #fff1c0);
    }

    .player-slide.is-headshot img {
      object-fit: contain;
      padding: clamp(24px, 6vw, 72px);
    }

    .player-slide::after {
      display: none;
    }

    .slide-caption {
      display: none;
    }

    .slide-caption strong {
      display: block;
      margin-bottom: 8px;
      font-size: clamp(2rem, 6vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .slide-caption span {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      font-weight: 900;
      backdrop-filter: blur(10px);
    }

    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }

    .carousel-btn {
      display: inline-grid;
      width: 44px;
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background:
        linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 246, 228, 0.72));
      color: #6b2432;
      cursor: pointer;
      font-size: 1.4rem;
      font-weight: 900;
      place-items: center;
      box-shadow: 0 10px 26px rgba(95, 35, 42, 0.12);
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .carousel-btn:hover,
    .carousel-btn:focus-visible {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(95, 35, 42, 0.18);
      outline: none;
    }

    .carousel-dots {
      display: flex;
      flex: 1;
      justify-content: center;
      gap: 8px;
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      background: rgba(107, 36, 50, 0.24);
      cursor: pointer;
      padding: 0;
      transition: width 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .carousel-dot.is-active {
      width: 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, #166ee5, #d71920);
      transform: translateY(-1px);
    }

    .love-collage::before {
      inset: 14px;
      border-color: rgba(255, 255, 255, 0.5);
      border-radius: 8px;
    }

    .poster-chip {
      background: rgba(255, 255, 255, 0.68);
      color: #7a4f2c;
    }

    .chip-kitty {
      left: 7%;
      top: 8%;
    }

    .chip-fox {
      right: 7%;
      top: 8%;
    }

    .chip-football {
      left: 8%;
      bottom: 8%;
    }

    .chip-love {
      right: 8%;
      bottom: 8%;
      color: #ef3f3a;
    }

    .poster-image {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    body[data-state="love"] .love-collage {
      background: #fff7bd;
    }

    body[data-state="love"] .love-collage::before,
    body[data-state="love"] .collage-svg,
    body[data-state="love"] .poster-chip {
      display: none;
    }

    @media (max-width: 1040px) {
      .page {

      .countdown-page .hero {
        grid-template-columns: minmax(0, 1fr);

      }

      .countdown-page .art {

    @media (max-width: 380px) {
      .page {
        padding: 10px;
      }

      .countdown-page .art {
        width: 100%;
      }

      .countdown-copy {
        padding: 14px 10px;
      }

      .countdown {
        gap: 8px;
      }

        min-height: 86px;
      }

      .time-box strong {

    @media (prefers-reduced-motion: no-preference) {
      .floating {
        animation: float 4.8s ease-in-out infinite;
      }

      .floating.star {
        animation-delay: -1.4s;
      }

      .floating.football {
        animation-delay: -2.2s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-13px);
        }
      }

      @keyframes musicPulse {
        0% {
          opacity: 0.72;
          transform: scale(0.92);
        }

        100% {
          opacity: 0;
          transform: scale(1.28);

    /* Final visual polish: keep the 520 sports-poster mood, but make it feel more crafted. */
    :root {
      --display-font: "STKaiti", "KaiTi", "FZYaoti", "华文行楷", "Microsoft YaHei", serif;
      --body-font: "LXGW WenKai", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --poster-radius: clamp(22px, 3vw, 34px);
      --ticket-radius: 20px;
      --cream: #fff8dc;
      --warm-ink: #402538;
      --blue-glow: rgba(22, 110, 229, 0.25);
      --red-glow: rgba(215, 25, 32, 0.22);
    }

    body {
      font-family: var(--body-font);
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 120, 170, 0.26), transparent 26%),
        radial-gradient(circle at 86% 12%, rgba(22, 110, 229, 0.24), transparent 24%),
        radial-gradient(circle at 70% 88%, rgba(245, 185, 66, 0.24), transparent 24%),
        linear-gradient(135deg, #fff8ee 0%, #fff2f7 42%, #edf7ff 100%);
    }

    body::before {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.46) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.46) 1px, transparent 1px),
        radial-gradient(circle, rgba(64, 37, 56, 0.10) 1px, transparent 1.6px);
      background-size: 44px 44px, 44px 44px, 18px 18px;
    }

    h1,
    .love-title,
    .time-box strong {
      font-family: var(--display-font);
      letter-spacing: 0.015em;
    }

    .countdown-copy,
    .player-carousel {
      border-radius: var(--poster-radius);
    }

    .countdown-copy {
      border: 1px solid rgba(255, 255, 255, 0.78);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 247, 225, 0.72)),
        repeating-linear-gradient(135deg, rgba(22, 110, 229, 0.045) 0 9px, rgba(215, 25, 32, 0.045) 9px 18px);
      box-shadow:
        0 34px 90px rgba(86, 46, 58, 0.18),
        0 0 0 8px rgba(255, 255, 255, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .countdown-copy::before {
      height: 10px;
      background:
        linear-gradient(90deg, #166ee5 0 24%, #fff 24% 30%, #d71920 30% 58%, #fff 58% 64%, #ff78aa 64% 82%, #f5b942 82% 100%);
    }

    .countdown-copy::after {
      right: -50px;
      bottom: -58px;
      width: 170px;
      background:
        radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.55), transparent 26%),
        radial-gradient(circle, rgba(255, 120, 170, 0.22), transparent 70%);
    }

    .countdown-page h1 {
      text-shadow: 0 12px 34px rgba(111, 58, 36, 0.16);
    }

    .countdown-page h1::before,
    .countdown-page h1::after {
      border-color: rgba(255, 255, 255, 0.84);
      box-shadow: 0 16px 34px rgba(82, 46, 57, 0.14);
    }

    .countdown {
      filter: drop-shadow(0 18px 28px rgba(112, 63, 44, 0.12));
    }

    .time-box {
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: var(--ticket-radius);
      background:
        radial-gradient(circle at 50% -18px, transparent 0 18px, rgba(255, 255, 255, 0.9) 19px),
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 246, 221, 0.80));
      box-shadow:
        0 18px 42px rgba(116, 67, 48, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }

    .time-box::before {
      height: 7px;
      background: linear-gradient(90deg, #166ee5, #fff 18% 24%, #d71920 24% 66%, #fff 66% 72%, #f5b942);
    }

    .time-box strong {
      color: #d71920;
      text-shadow: 0 8px 18px rgba(215, 25, 32, 0.12);
    }

    .time-box span {
      color: #77532f;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .art {
      border-radius: var(--poster-radius);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.52), transparent 34%),
        #fff7bd;
      box-shadow:
        0 36px 96px rgba(126, 75, 38, 0.24),
        0 0 0 10px rgba(255, 255, 255, 0.36),
        0 0 0 1px rgba(255, 255, 255, 0.84);
    }

    .art::before {
      border-color: rgba(255, 255, 255, 0.28);
    }

    .countdown-image {
      border-radius: inherit;
      filter: saturate(1.05) contrast(1.03);
    }

    .countdown-image-gloss {
      background:
        linear-gradient(115deg, rgba(255, 255, 255, 0.38), transparent 34%),
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.44), transparent 18%),
        linear-gradient(180deg, transparent 62%, rgba(64, 37, 56, 0.10));
    }

    body[data-state="love"] {
      background:
        linear-gradient(rgba(255, 248, 238, 0.52), rgba(255, 237, 219, 0.62)),
        radial-gradient(circle at 14% 14%, var(--blue-glow), transparent 26%),
        radial-gradient(circle at 86% 16%, var(--red-glow), transparent 24%),
        url("assets/flower-bg-tulips.jpg") center bottom / cover fixed;
    }

    .love-copy {
      isolation: isolate;
    }

    .love-copy::before,
    .love-copy::after {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 7px 14px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      color: #76512e;
      font-size: clamp(0.78rem, 1.8vw, 0.92rem);
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(90, 42, 42, 0.10);
    }

    .love-copy::before {
      display: none;
      content: none;
    }

    .love-copy::after {
      display: none;
      content: none;
    }

    .love-title {
      position: relative;
      display: inline-block;
      padding-inline: clamp(8px, 2vw, 18px);
      background:
        linear-gradient(90deg, #0d5ed0 0%, #166ee5 20%, #c63362 48%, #d71920 73%, #f5b942 100%);
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 16px 28px rgba(95, 35, 42, 0.18));
    }

    .love-title::before,
    .love-title::after {
      position: absolute;
      top: 50%;
      width: clamp(40px, 8vw, 92px);
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(215, 25, 32, 0.75), transparent);
      content: "";
    }

    .love-title::before {
      right: 100%;
    }

    .love-title::after {
      left: 100%;
    }

    .love-slogan {
      width: min(860px, calc(100% - 24px));
      margin: clamp(6px, 1.4vw, 12px) auto 0;
      padding: clamp(10px, 1.7vw, 14px) clamp(18px, 4vw, 34px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.66), rgba(255, 247, 226, 0.48)),
        linear-gradient(90deg, rgba(255, 120, 170, 0.10), rgba(22, 110, 229, 0.08), rgba(245, 185, 66, 0.10));
      box-shadow:
        0 14px 34px rgba(90, 42, 42, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.86);
      color: #5f3b35;
      font-size: clamp(1rem, 1.9vw, 1.18rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.72;
      text-wrap: balance;
      backdrop-filter: blur(16px);
    }

    .love-slogan strong {
      position: relative;
      display: inline-block;
      margin: 0 0.08em;
      padding: 0 0.08em;
      font-family: var(--display-font);
      font-size: 1.16em;
      font-weight: 1000;
      letter-spacing: 0.04em;
      line-height: 1;
      color: transparent;
      background: linear-gradient(90deg, #0d5ed0 0%, #1f7cf2 58%, #8f5b22 100%);
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 5px 10px rgba(22, 110, 229, 0.12));
    }

    .love-slogan strong::after {
      position: absolute;
      right: 0.02em;
      bottom: -0.2em;
      left: 0.02em;
      height: 0.12em;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(245, 185, 66, 0.12), rgba(245, 185, 66, 0.72), rgba(22, 110, 229, 0.42), rgba(245, 185, 66, 0.12));
      content: "";
      transform: rotate(-1.2deg);
    }

    .player-carousel {
      padding: clamp(14px, 2.4vw, 24px);
      border-color: rgba(255, 255, 255, 0.76);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 246, 225, 0.68)),
        radial-gradient(circle at 13% 20%, rgba(22, 110, 229, 0.22), transparent 28%),
        radial-gradient(circle at 86% 78%, rgba(215, 25, 32, 0.20), transparent 28%);
      box-shadow:
        0 34px 100px rgba(78, 36, 43, 0.24),
        0 0 0 8px rgba(255, 255, 255, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
    }

    .player-carousel::before {
      height: 11px;
      background:
        linear-gradient(90deg, #166ee5 0 23%, #fff 23% 29%, #d71920 29% 60%, #fff 60% 66%, #ff78aa 66% 83%, #f5b942 83% 100%);
    }

    .player-carousel::after {
      inset: clamp(12px, 2vw, 20px);
      border-radius: calc(var(--poster-radius) - 10px);
      border-color: rgba(255, 255, 255, 0.55);
    }

    .carousel-window {
      border-radius: calc(var(--poster-radius) - 12px);
      background:
        radial-gradient(circle at 16% 18%, rgba(22, 110, 229, 0.38), transparent 30%),
        radial-gradient(circle at 82% 72%, rgba(215, 25, 32, 0.34), transparent 30%),
        linear-gradient(135deg, #1c3d75, #5b1e2a);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
        inset 0 -42px 90px rgba(64, 37, 56, 0.16);
    }

    .player-slide::before {
      background-image: none;
      filter: blur(24px) saturate(1.18) contrast(1.02);
      opacity: 0;
    }

    .player-slide.is-active::before {
      background-image: var(--slide-bg);
      opacity: 0.62;
    }

    .player-slide img {
      filter: saturate(1.09) contrast(1.045);
    }

    .carousel-btn {
      border-color: rgba(255, 255, 255, 0.82);
      background:
        radial-gradient(circle at 34% 22%, rgba(255, 255, 255, 0.98), rgba(255, 246, 228, 0.74));
      color: #7a2635;
      box-shadow: 0 12px 28px rgba(95, 35, 42, 0.15);
    }

    .carousel-dot {
      background: rgba(92, 52, 56, 0.23);
    }

    .carousel-dot.is-active {
      background: linear-gradient(90deg, #166ee5, #d71920, #f5b942);
    }

    .music-toggle {
      border-color: rgba(255, 255, 255, 0.82);
      box-shadow:
        0 18px 44px rgba(66, 38, 88, 0.20),
        0 0 0 7px rgba(255, 255, 255, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
    }

    @media (prefers-reduced-motion: no-preference) {
      .countdown-copy,
      .art,
      .love-copy,
      .player-carousel {
        animation: posterRise 720ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .art,
      .player-carousel {
        animation-delay: 90ms;
      }

      .time-box {
        animation: ticketPop 560ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .time-box:nth-child(2) {
        animation-delay: 70ms;
      }

      .time-box:nth-child(3) {
        animation-delay: 140ms;
      }

      .time-box:nth-child(4) {
        animation-delay: 210ms;
      }

      @keyframes posterRise {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.985);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes ticketPop {
        from {
          opacity: 0;
          transform: translateY(12px) rotate(-1deg);
        }

        to {
          opacity: 1;
          transform: translateY(0) rotate(0);
        }
      }

  <!-- Music: Lovely Piano Song, FreePD public domain / CC0. -->
  <audio class="bgm-audio" src="assets/audio/huyi520-bgm.mp3" preload="auto" loop></audio>
  <button class="music-toggle" type="button" aria-label="Play background music" aria-pressed="false">
    <span class="music-icon" aria-hidden="true">♪</span>
  </button>

  <script>
    const targetTime = new Date("2026-05-19T16:45:00+08:00").getTime();
    const params = new URLSearchParams(window.location.search);
    const previewLove = params.get("preview") === "love";
    const musicButton = document.querySelector(".music-toggle");
    const bgmAudio = document.querySelector(".bgm-audio");
    let musicUnlockBound = false;
    let unbindMusicUnlock = () => {};
    const units = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateMusicButton(isPlaying) {
      musicButton?.classList.toggle("is-playing", isPlaying);
      musicButton?.setAttribute("aria-label", isPlaying ? "Pause background music" : "Play background music");
      musicButton?.setAttribute("aria-pressed", String(isPlaying));
    }

    async function playMusic() {
      if (!bgmAudio) {
        return false;
      }

      bgmAudio.volume = 0.38;
      try {
        await bgmAudio.play();
        unbindMusicUnlock();
        updateMusicButton(true);
        return true;
      } catch (error) {
        console.info("Background music could not start yet:", error);
        updateMusicButton(false);
        return false;
      }
    }

    function bindMusicUnlock() {
      if (!bgmAudio || musicUnlockBound || !bgmAudio.paused) {
        return;
      }

      musicUnlockBound = true;

      const cleanup = () => {
        document.removeEventListener("pointerdown", unlockMusic);
        document.removeEventListener("keydown", unlockMusic);
        musicUnlockBound = false;
        unbindMusicUnlock = () => {};
      };

      const unlockMusic = async (event) => {
        if (event?.target?.closest?.(".music-toggle")) {
          return;
        }

        cleanup();
        await playMusic();
      };

      unbindMusicUnlock = cleanup;
      document.addEventListener("pointerdown", unlockMusic);
      document.addEventListener("keydown", unlockMusic);
    }

    async function toggleMusic() {
      if (!bgmAudio || !musicButton) {
        return;
      }

      if (!bgmAudio.paused) {
        bgmAudio.pause();
        updateMusicButton(false);
        return;
      }

      const didPlay = await playMusic();
      if (!didPlay) {
        bindMusicUnlock();
      }
    }

    async function autoplayMusic() {
      if (!bgmAudio) {
        return;
      }

      const didPlay = await playMusic();
      if (!didPlay) {
        bindMusicUnlock();
      }
    }

    function revealLovePage() {
      document.body.dataset.state = "love";
      document.title = "HuYi520";
      startCarousel();
    }

    function startCarousel() {
      const slides = Array.from(document.querySelectorAll(".player-slide"));
      const dotsWrap = document.querySelector(".carousel-dots");
      const prev = document.querySelector("[data-carousel-prev]");
      const next = document.querySelector("[data-carousel-next]");

      if (!slides.length || !dotsWrap || dotsWrap.dataset.ready === "true") {
        return;
      }

      let active = 0;
      let timer = 0;
      dotsWrap.dataset.ready = "true";

      const dots = slides.map((_, index) => {
        const dot = document.createElement("button");
        dot.className = "carousel-dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `第 ${index + 1} 张`);
        dot.addEventListener("click", () => showSlide(index, true));
        dotsWrap.appendChild(dot);
        return dot;
      });

      function showSlide(index, userAction = false) {
        active = (index + slides.length) % slides.length;
        slides.forEach((slide, slideIndex) => {
          slide.classList.toggle("is-active", slideIndex === active);
        });
        dots.forEach((dot, dotIndex) => {
          dot.classList.toggle("is-active", dotIndex === active);
        });
        if (userAction) {
          restart();
        }
        preloadAround(active);
      }

      function restart() {
        window.clearInterval(timer);
        timer = window.setInterval(() => showSlide(active + 1), 4200);
      }

      function preloadAround(index) {
        [index + 1, index + 2].forEach((nextIndex, offset) => {
          const img = slides[nextIndex % slides.length]?.querySelector("img");
          if (img && !img.dataset.preloaded) {
            img.loading = offset === 0 ? "eager" : "lazy";
            img.fetchPriority = offset === 0 ? "high" : "low";
            const preload = new Image();
            preload.src = img.currentSrc || img.src;
            if (typeof preload.decode === "function") {
              preload.decode().catch(() => {});
            }
            img.dataset.preloaded = "true";
          }
        });
      }

      prev?.addEventListener("click", () => showSlide(active - 1, true));
      next?.addEventListener("click", () => showSlide(active + 1, true));
      showSlide(0);
      restart();
    }

    function updateCountdown() {
      if (previewLove) {
        revealLovePage();
        return;
      }

      const distance = targetTime - Date.now();
      if (distance <= 0) {
        revealLovePage();
        return;
      }

      const totalSeconds = Math.floor(distance / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      units.days.textContent = pad(days);
      units.hours.textContent = pad(hours);
      units.minutes.textContent = pad(minutes);
      units.seconds.textContent = pad(seconds);
    }

    updateCountdown();
    musicButton?.addEventListener("click", toggleMusic);
    autoplayMusic();
    window.setInterval(updateCountdown, 1000);
  </script>
